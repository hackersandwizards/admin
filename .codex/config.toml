model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
project_doc_fallback_filenames = ["CLAUDE.md"]
tui.status_line = ["current-dir", "git-branch", "model-with-reasoning", "context-remaining", "five-hour-limit"]

[features]
js_repl = false
apps = false

[notice]
hide_rate_limit_model_nudge = true

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."github@openai-curated"]
enabled = false

[plugins."github@openai-curated-remote"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = false

[mcp_servers.chrome-devtools]
command = "sh"
args = ["-c", "cd \"${CLAUDE_PROJECT_DIR:-.}\" && { CHECK_LOCK_RUN_S=${CHECK_LOCK_RUN_S:-60} .githooks/install; exec bun run --silent chrome-mcp; }"]
startup_timeout_sec = 60
